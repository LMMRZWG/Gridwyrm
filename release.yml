name: Build and release

# Pushing a tag, or publishing a release, builds Gridwyrm.exe on a Windows
# machine that GitHub provides free for public repositories, then attaches it to
# the release. That means you never build locally, and the download link in the
# README (releases/latest/download/Gridwyrm.exe) keeps working on its own.
#
# It can also be run by hand from the Actions tab to check a build without
# publishing anything, in which case the exe appears as an artifact instead.

on:
  # Publishing a release from the website. The reliable trigger, because it does
  # not depend on how the tag was made or what it is called.
  release:
    types: [published]

  # Pushing a tag from a command line fires it too. Case matters here: V1.0
  # would not match, which is worth knowing before wondering why nothing ran.
  push:
    tags:
      - "v*"

  # And by hand, from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write          # needed to create the release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the files we need are present
        shell: bash
        run: |
          # Failing here with a plain message beats a confusing PyInstaller
          # error twenty lines deep.
          for needed in gridwyrm.pyw icon.ico test_gridwyrm.py; do
            if [ ! -f "$needed" ]; then
              echo "::error::$needed is missing from the repository"
              exit 1
            fi
          done
          echo "gridwyrm.pyw, icon.ico and test_gridwyrm.py are all here"

      - name: Run the tests
        run: python -m unittest discover -v
        # A failing test stops the build, so a broken version is never
        # published. tkinter ships with the runner's Python, so the module
        # imports normally here.

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build Gridwyrm.exe
        run: >
          pyinstaller --onefile --windowed --noupx --clean --noconfirm
          --name Gridwyrm --icon icon.ico gridwyrm.pyw

      - name: Keep the exe even without a tag
        uses: actions/upload-artifact@v4
        with:
          name: Gridwyrm-exe
          path: dist/Gridwyrm.exe

      - name: Attach it to the release
        # True for both a published release and a tag push, and false for a
        # manual run, which is what leaves the artifact as the only output.
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Create the release if this tag has none yet, otherwise replace the
          # file on the existing one.
          gh release create "$GITHUB_REF_NAME" dist/Gridwyrm.exe \
            --title "$GITHUB_REF_NAME" --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" dist/Gridwyrm.exe --clobber
