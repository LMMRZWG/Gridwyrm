name: Build and release

# Pushing a tag that starts with "v" builds the exe on a Windows machine that
# GitHub provides free for public repositories, then attaches it to a release.
# That means you never build locally, and the download link in the README
# (releases/latest/download/Gridwyrm.exe) starts working on its own.
#
# You can also run it by hand from the Actions tab to check a build without
# publishing anything.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write          # needed to create the release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the tests
        run: python -m unittest discover -v
        # A failing test stops the build, so a broken version never gets
        # published. tkinter ships with the runner's Python, so the module
        # imports normally here.

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build Gridwyrm.exe
        run: >
          pyinstaller --onefile --windowed --noupx --clean --noconfirm
          --name Gridwyrm --icon icon.ico gridwyrm.pyw

      - name: Keep the exe even without a tag
        uses: actions/upload-artifact@v4
        with:
          name: Gridwyrm-exe
          path: dist/Gridwyrm.exe

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Create the release if this tag has none yet, otherwise replace the
          # file on the existing one.
          gh release create "$GITHUB_REF_NAME" dist/Gridwyrm.exe \
            --title "$GITHUB_REF_NAME" --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" dist/Gridwyrm.exe --clobber
